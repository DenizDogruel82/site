<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Yeni sezon alışveriş fırsatları banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- dekoratif daireler -->
  <circle cx="1050" cy="80" r="160" fill="#ffffff" opacity="0.08"/>
  <circle cx="900" cy="440" r="120" fill="#ffffff" opacity="0.07"/>
  <circle cx="120" cy="460" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="620" cy="60" r="12" fill="#fde68a"/>
  <circle cx="1130" cy="300" r="8" fill="#ffffff" opacity="0.7"/>
  <circle cx="700" cy="420" r="6" fill="#fde68a"/>

  <!-- metin -->
  <text x="80" y="170" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#fde68a" font-weight="bold" letter-spacing="3">YENİ SEZON</text>
  <text x="80" y="250" font-family="Arial, Helvetica, sans-serif" font-size="68" fill="#ffffff" font-weight="bold">Alışverişin Keyfini</text>
  <text x="80" y="325" font-family="Arial, Helvetica, sans-serif" font-size="68" fill="#ffffff" font-weight="bold">Çıkar!</text>
  <text x="80" y="375" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e9d5ff">Binlerce ürün, uygun fiyatlar, hızlı teslimat.</text>

  <!-- buton -->
  <rect x="80" y="405" width="220" height="56" rx="28" fill="#fde68a"/>
  <text x="190" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#4c1d95">Hemen Keşfet</text>

  <!-- alışveriş çantası -->
  <g transform="translate(790 110)">
    <ellipse cx="170" cy="310" rx="150" ry="18" fill="#000000" opacity="0.18"/>
    <path d="M90 90 C90 20 250 20 250 90" fill="none" stroke="#fde68a" stroke-width="14" stroke-linecap="round"/>
    <path d="M40 90 H300 L320 300 Q321 318 303 318 H37 Q19 318 20 300 Z" fill="url(#bag)"/>
    <path d="M40 90 H300 L303 125 H37 Z" fill="#ffffff" opacity="0.25"/>
    <circle cx="105" cy="90" r="9" fill="#4c1d95"/>
    <circle cx="235" cy="90" r="9" fill="#4c1d95"/>
    <!-- indirim rozeti -->
    <g transform="translate(170 215)">
      <circle r="52" fill="#ef4444"/>
      <circle r="44" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4"/>
      <text y="-2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">%50</text>
      <text y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">İNDİRİM</text>
    </g>
  </g>
</svg>
